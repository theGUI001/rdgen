<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batch Build Status</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family:'Roboto',sans-serif; background:#000; color:#e0e0e0; margin:0; padding:20px; }
        .wrap { max-width:820px; margin:0 auto; }
        h1 { color:#fff; text-align:center; }
        .sub { text-align:center; color:#889; margin-bottom:8px; }
        .overall { text-align:center; color:#aab; margin-bottom:24px; }
        .progress { height:8px; background:#222; border-radius:5px; overflow:hidden; max-width:420px; margin:14px auto; }
        .progress > div { height:100%; width:0; background:linear-gradient(90deg,#4d7bff,#00d4ff); transition:width .4s; }
        .job { display:flex; align-items:center; gap:16px; background:#111; border:1px solid #222; border-radius:10px; padding:16px 20px; margin-bottom:14px; }
        .job .icon { font-size:30px; width:44px; text-align:center; color:#bbb; }
        .job .body { flex:1; min-width:0; }
        .job .plat { font-weight:700; color:#fff; text-transform:capitalize; }
        .job .status { font-size:.9em; margin-top:3px; }
        .job .meta { font-size:.8em; color:#778; margin-top:3px; word-break:break-all; }
        .job a { color:#4d7bff; text-decoration:none; }
        .spin { animation:spin 1s linear infinite; display:inline-block; }
        @keyframes spin { 100% { transform:rotate(360deg); } }
        .badge { padding:3px 10px; border-radius:20px; font-size:.8em; font-weight:700; }
        .s-running { color:#ffd479; } .b-running { background:#3a2f10; color:#ffd479; }
        .s-success { color:#5cd97a; } .b-success { background:#123a1c; color:#5cd97a; }
        .s-failure { color:#ff6b6b; } .b-failure { background:#3a1212; color:#ff6b6b; }
        .s-queued  { color:#9aa; }    .b-queued  { background:#222; color:#9aa; }
        .toolbar { text-align:center; margin-top:24px; }
        .toolbar a { color:#4d7bff; text-decoration:none; margin:0 10px; }
        .dl { margin-top:6px; }
        .dl a { display:inline-block; margin-right:12px; font-size:.9em; }
    </style>
</head>
<body>
<div class="wrap">
    <h1><i class="fas fa-layer-group"></i> Batch Build Status</h1>
    <div class="sub" id="label"></div>
    <div class="overall" id="overall">Loading…</div>
    <div class="progress"><div id="bar"></div></div>
    <div id="jobs"></div>
    <div class="toolbar">
        <a href="/batch"><i class="fas fa-plus"></i> New batch</a>
        <a href="/generator"><i class="fas fa-cube"></i> Single build</a>
    </div>
</div>

<script>
    const BATCH_UUID = "{{ batch.uuid }}";
    const RUNNING = new Set(); // uuids still in progress

    const ICONS = { linux:"fab fa-linux", windows:"fab fa-windows", android:"fab fa-android", macos:"fab fa-apple" };
    const DONE = ["success","failure","cancelled","timed_out","skipped"];

    function statusClass(s){
        if (s === "success") return "success";
        if (["failure","cancelled","timed_out","skipped"].includes(s)) return "failure";
        if (s === "queued") return "queued";
        return "running";
    }

    function iconFor(s){
        if (s === "success") return '<i class="fas fa-check-circle s-success"></i>';
        if (["failure","cancelled","timed_out","skipped"].includes(s)) return '<i class="fas fa-times-circle s-failure"></i>';
        if (s === "queued") return '<i class="fas fa-hourglass-half s-queued"></i>';
        return '<i class="fas fa-circle-notch spin s-running"></i>';
    }

    function downloadLinks(job){
        // Once a build succeeds, its artifacts are on the server keyed by uuid.
        if (job.status !== "success") return "";
        const base = job.filename || "rustdesk";
        // The exact filenames vary per platform; offer the generic download route.
        const exts = {
            linux:   [base + "-x86_64.deb", base + "-x86_64.rpm"],
            windows: [base + ".exe", base + ".msi"],
            android: [base + "-aarch64.apk", base + "-armv7.apk", base + "-x86_64.apk"]
        }[job.platform] || [base];
        let html = '<div class="dl">';
        exts.forEach(function(f){
            html += '<a href="/download?uuid=' + encodeURIComponent(job.uuid) + '&filename=' + encodeURIComponent(f) + '"><i class="fas fa-download"></i> ' + f + '</a>';
        });
        return html + '</div>';
    }

    function render(data){
        document.getElementById("label").textContent = data.label || data.filename || "";
        document.getElementById("overall").textContent =
            data.completed + " of " + data.total + " build(s) finished" + (data.all_done ? " — all done." : "…");
        document.getElementById("bar").style.width =
            (data.total ? Math.round(100 * data.completed / data.total) : 0) + "%";

        const container = document.getElementById("jobs");
        container.innerHTML = "";
        data.jobs.forEach(function(job){
            const cls = statusClass(job.status);
            const div = document.createElement("div");
            div.className = "job";
            let statusLine = '<span class="badge b-' + cls + '">' + job.status + '</span>';
            let meta = "";
            if (job.log_url) meta += '<a href="' + job.log_url + '" target="_blank"><i class="fas fa-external-link-alt"></i> build log</a>';
            if (job.error) meta += '<span class="s-failure"> ' + job.error + '</span>';
            div.innerHTML =
                '<div class="icon">' + iconFor(job.status) + '</div>' +
                '<div class="body">' +
                    '<div class="plat"><i class="' + (ICONS[job.platform]||"fas fa-cube") + '"></i> ' + job.platform + '</div>' +
                    '<div class="status">' + statusLine + '</div>' +
                    (meta ? '<div class="meta">' + meta + '</div>' : "") +
                    downloadLinks(job) +
                '</div>';
            container.appendChild(div);
        });
    }

    function poll(){
        fetch("/batch/status_json?batch=" + encodeURIComponent(BATCH_UUID))
            .then(r => r.json())
            .then(function(data){
                if (data.error){ document.getElementById("overall").textContent = data.error; return; }
                render(data);
                if (!data.all_done) setTimeout(poll, 8000);
            })
            .catch(function(){ setTimeout(poll, 12000); });
    }
    poll();
</script>
</body>
</html>
