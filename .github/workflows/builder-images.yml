name: Build Docker Builder Images

# Builds the RustDesk builder toolchain images and pushes them to GHCR, so that
# docker-generator.yml (and local `scripts/rdbuild.sh`) can pull a ready-made
# image instead of installing the toolchain on every build.
#
# Run it manually the first time, and whenever a Dockerfile or the build scripts
# change. The images are big; each one caches its own layers.

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma separated: linux,android,windows'
        required: true
        default: 'linux,android'
        type: string
      tag:
        description: 'Image tag to publish'
        required: false
        default: 'latest'
        type: string
  push:
    branches: [master]
    paths:
      - 'docker/**'
      - 'scripts/**'
      - '.github/workflows/builder-images.yml'

env:
  REGISTRY: ghcr.io

jobs:
  # Decide which images to (re)build from the trigger.
  plan:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.pick.outputs.linux }}
      android: ${{ steps.pick.outputs.android }}
      windows: ${{ steps.pick.outputs.windows }}
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        run: |
          PLATFORMS="${{ github.event.inputs.platforms }}"
          TAG="${{ github.event.inputs.tag }}"
          # On push we default to the always-buildable Linux images.
          if [ -z "$PLATFORMS" ]; then PLATFORMS="linux,android"; fi
          if [ -z "$TAG" ]; then TAG="latest"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          for p in linux android windows; do
            if echo "$PLATFORMS" | tr ',' '\n' | grep -qx "$p"; then
              echo "$p=true" >> "$GITHUB_OUTPUT"
            else
              echo "$p=false" >> "$GITHUB_OUTPUT"
            fi
          done

  linux:
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push linux builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/linux-builder.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rdgen-linux-builder:${{ needs.plan.outputs.tag }}
          cache-from: type=gha,scope=linux-builder
          cache-to: type=gha,scope=linux-builder,mode=max

  android:
    needs: plan
    if: needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push android builder
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/android-builder.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rdgen-android-builder:${{ needs.plan.outputs.tag }}
          cache-from: type=gha,scope=android-builder
          cache-to: type=gha,scope=android-builder,mode=max

  windows:
    needs: plan
    if: needs.plan.outputs.windows == 'true'
    runs-on: windows-2022
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push windows builder
        # Windows images are huge and slow; buildx cache export is unreliable
        # on Windows runners, so we use a plain build + push here.
        shell: pwsh
        run: |
          $img = "ghcr.io/${{ github.repository_owner }}/rdgen-windows-builder:${{ needs.plan.outputs.tag }}".ToLower()
          docker build -f docker/windows-builder.Dockerfile -t $img .
          docker push $img
